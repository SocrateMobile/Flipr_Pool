# Exemple de configuration Lovelace avec la carte "Pool Monitor Card"
# Cette carte nécessite l'installation préalable de "pool-monitor-card" via HACS Frontend.
# https://github.com/aallinne/pool-monitor-card

# Remplacez le préfixe "jardin_flipr_piscine" par le nom de votre propre pièce/appareil
# si celui-ci est différent (ex: "salon_flipr_spa", "terrasse_flipr_piscine", etc.)
type: custom:pool-monitor-card
title: Ma Piscine
temperature: sensor.jardin_flipr_piscine_temperature_de_l_eau
ph: sensor.jardin_flipr_piscine_ph
orp: sensor.jardin_flipr_piscine_potentiel_redox
tds: sensor.jardin_flipr_piscine_conductivite
chlorine: sensor.jardin_flipr_piscine_desinfectant_chlore
filter: switch.jardin_flipr_piscine_pompe_filtration

# Options d'affichage
show_names: true
show_labels: true
compact: false

# Définition des cibles (Setpoints) Flipr
override:
  ph:
    min: 6.8
    max: 8.0
    setpoint: 7.4
    step: 0.1
  orp:
    min: 500
    max: 900
    setpoint: 700
    step: 10
  chlorine:
    min: 0.0
    max: 3.5
    setpoint: 2.0
    step: 0.5
